services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: ops }
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 3s, retries: 20 }
    ports: ["5432:5432"]
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ops
      JWT_SECRET: dev-secret
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
